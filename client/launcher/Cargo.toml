[package]
name = "darkan-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
# Windowing + WebView
tao = "0.34"
wry = "0.49"

# Async runtime + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
bytes = "1"

# Archive extraction (pure Rust)
ar = "0.9"
tar = "0.4"
xz2 = "0.1"

# Crypto
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform
directories = "6"
fs2 = "0.4"

# Embed UI assets
rust-embed = "8"

# URL handling
url = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
